services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scv
      POSTGRES_PASSWORD: scv
      POSTGRES_DB: scv
    ports:
      - "5432:5432"
    volumes:
      - scv-pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  vision:
    build:
      context: .
      dockerfile: services/vision/Dockerfile
    environment:
      SCV_INFERENCE_TMP: /tmp/scv-inference
    ports:
      - "8001:8001"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://scv:scv@postgres:5432/scv
      REDIS_URL: redis://redis:6379/0
      VISION_URL: http://vision:8001
      SCV_DEMO: "1"
      SCV_SECRET: change-me
      CATALOG_PATH: /srv/data/catalog.json
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - vision

volumes:
  scv-pg:
